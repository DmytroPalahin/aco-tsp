name: Bug report
description: Something crashes, hangs, or gives a wrong result
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >
        The exact command line, including `--seed`, and the instance file (attach it or paste
        it if it is small). A run is deterministic for a given seed, so this is usually enough
        to reproduce the problem exactly.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `aco-tsp --version`, or the commit you built.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, compiler and version, build type.
      placeholder: Ubuntu 24.04, GCC 13.3, Release
    validations:
      required: true
