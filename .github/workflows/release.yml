name: Release

# Pushing a tag such as v2.0.0 builds the binaries for the three platforms,
# typesets the report and publishes everything as a GitHub release whose
# notes are the matching section of CHANGELOG.md.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # The tag, the CMake project version and the changelog must agree.
  verify:
    name: Check the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          project=$(sed -n 's/^  VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt)
          if [[ $version != "$project" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the CMake project version $project"
            exit 1
          fi
          if ! grep --quiet "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

  package:
    name: Package / ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04 }
          - { name: macOS, os: macos-15 }
          - { name: Windows, os: windows-2025 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure --no-tests=error
      - name: Package
        working-directory: build
        run: cpack -C Release -B ../dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  report:
    name: Report (PDF)
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # 4.1.0
        with:
          working_directory: report
          root_file: report.tex
      # A fixed name keeps .../releases/latest/download/aco-tsp-report.pdf valid.
      - run: mv report/report.pdf aco-tsp-report.pdf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report
          path: aco-tsp-report.pdf
          if-no-files-found: error

  publish:
    name: Publish
    needs: [verify, package, report]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Extract the release notes
        run: |
          awk -v version="${{ needs.verify.outputs.version }}" '
            /^## \[/ { printing = index($0, "## [" version "]") == 1; next }
            /^\[[^]]+\]: / { printing = 0 }
            printing' CHANGELOG.md >notes.md
          test -s notes.md
      - name: Compute checksums
        working-directory: dist
        run: sha256sum -- * >SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "aco-tsp ${{ needs.verify.outputs.version }}"
          --notes-file notes.md
          --verify-tag
          dist/*
